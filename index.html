<script>
const WHATSAPP_PHONE = "905385475603";

window.PRODUCTS = [];
window.CUSTOMER_ORDERS = [];
let selectedProduct = null;
let uploadedBase64Files = [];
let pendingOrderMessage = "";

// Admin şifresi artık kodda yok, doğrudan Firebase'den güvenle çekiliyor.
let ADMIN_PASSWORD = "mami6060"; 
if (window.firebaseDb) {
  onValue(ref(window.firebaseDb, 'mami_admin_pass'), (snapshot) => {
    if(snapshot.exists()) ADMIN_PASSWORD = snapshot.val();
  });
}

let currentZoom = 1;
let currentRotation = 0;

const $ = id => document.getElementById(id);

function toast(title, text=""){
  const el=$("toast"); el.innerHTML=`<b>${title}</b>${text}`; el.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove("show"),3500);
}

function saveProducts() {
  if (window.firebaseDb) {
    const prodObj = {};
    window.PRODUCTS.forEach(p => { prodObj[p.id] = p; });
    window.dbSet(window.dbRef(window.firebaseDb, "mami_products"), prodObj);
  }
}

function saveCustomerOrders() {
  if (window.firebaseDb) {
    const ordersObj = {};
    window.CUSTOMER_ORDERS.forEach(o => { ordersObj[o.id] = o; });
    window.dbSet(window.dbRef(window.firebaseDb, "mami_customer_orders"), ordersObj);
  }
}

function compressImage(file, maxWidth = 800, quality = 0.65) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
    };
  });
}

function renderProducts() {
  const grid = $("productsGrid");
  if (!grid) return;
  grid.innerHTML = "";
  if (!window.PRODUCTS || window.PRODUCTS.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">🎨 Henüz katalogda tasarım yok. Sol üstteki M logosundan Admin paneline girip tasarım ekleyebilirsiniz.</div>`;
    return;
  }
  window.PRODUCTS.forEach(p => {
    const card = document.createElement("div");
    card.className = "product-card" + (selectedProduct && selectedProduct.id === p.id ? " selected" : "");
    card.innerHTML = `
      <button class="delete-btn" onclick="deleteProduct('${p.id}', event)">✕</button>
      <img src="${p.img}" class="product-img">
      <div class="product-body">
        <div>
          <div class="product-title">${p.title}</div>
          <div class="product-price">${Number(p.price).toLocaleString("tr-TR")} TL</div>
        </div>
        <button class="select-btn">${selectedProduct && selectedProduct.id === p.id ? "Seçildi ✓" : "Tasarımı Seç"}</button>
      </div>
    `;
    card.onclick = () => {
      selectedProduct = p;
      $("selectedProductTitle").value = p.title;
      $("selectedProductPrice").value = Number(p.price).toLocaleString("tr-TR") + " TL";
      renderProducts();
    };
    grid.appendChild(card);
  });
}
window.renderProducts = renderProducts;

function deleteProduct(id, e) {
  e.stopPropagation();
  if(!confirm("Bu tasarımı katalogdan kaldırmak istediğinize emin misiniz?")) return;
  window.PRODUCTS = window.PRODUCTS.filter(p => p.id !== id);
  if(window.firebaseDb) window.dbRemove(window.dbRef(window.firebaseDb, `mami_products/${id}`));
  renderProducts();
  toast("Silindi", "Tasarım sistemden kaldırıldı.");
}
window.deleteProduct = deleteProduct;

function renderCustomerFolders() {
  const list = $("customerFoldersList");
  if (!list) return;
  list.innerHTML = "";

  const query = $("adminSearchInput") ? $("adminSearchInput").value.toLowerCase().trim() : "";
  const filteredOrders = window.CUSTOMER_ORDERS.filter(o => 
    (o.custName && o.custName.toLowerCase().includes(query)) || 
    (o.custPhone && o.custPhone.includes(query))
  );

  if (!filteredOrders || filteredOrders.length === 0) {
    list.innerHTML = `<p style="color:var(--muted); font-size:13px; text-align:center; padding:30px;">Kayıtlı müşteri klasörü bulunamadı.</p>`;
    return;
  }

  filteredOrders.forEach(order => {
    const card = document.createElement("div");
    card.className = "folder-card";

    const photosHTML = (order.photos && order.photos.length) ?
      order.photos.map((p) => `<img src="${p}" class="folder-photo-thumb" onclick="openLightbox('${p}')" title="Büyütmek için tıklayın">`).join("") :
      `<p style="font-size:11px; color:var(--muted);">Görsel yok.</p>`;

    const status = order.status || "pending";

    card.innerHTML = `
      <div class="folder-header">
        <div>
          <div class="folder-title">📁 ${order.custName}</div>
          <div class="folder-meta">📞 ${order.custPhone} | 🕒 ${order.date}</div>
          <div class="folder-meta" style="color:var(--gold); font-weight:700; margin-top:2px;">Seçilen: ${order.productTitle} (${Number(order.productPrice).toLocaleString("tr-TR")} TL)</div>
        </div>
        <div>
          <select class="status-select status-${status}" onchange="updateOrderStatus('${order.id}', this.value)">
            <option value="pending" ${status==='pending'?'selected':''}>⏳ Beklemede</option>
            <option value="processing" ${status==='processing'?'selected':''}>⚙️ Hazırlanıyor</option>
            <option value="completed" ${status==='completed'?'selected':''}>✅ Tamamlandı</option>
          </select>
        </div>
      </div>
      <div style="font-size:12px; color:var(--text); margin-bottom:10px; background:rgba(0,0,0,0.2); padding:8px; border-radius:8px;"><b>Notlar:</b> ${order.notes || 'Özel not iletilmedi.'}</div>
      <div style="font-size:11px; font-weight:800; color:var(--gold); margin-bottom:6px;">YÜKLENEN ARAÇ FOTOĞRAFLARI (${order.photos ? order.photos.length : 0})</div>
      <div class="folder-photos-grid">${photosHTML}</div>

      <div class="folder-actions">
        <button class="btn-sm" onclick="downloadAllPhotos('${order.id}')">📥 Fotoğrafları İndir</button>
        <button class="btn-sm btn-danger" onclick="deleteCustomerFolder('${order.id}')">🗑 Klasörü Sil</button>
      </div>
    `;
    list.appendChild(card);
  });
}
window.renderCustomerFolders = renderCustomerFolders;

function updateOrderStatus(id, newStatus) {
  const index = window.CUSTOMER_ORDERS.findIndex(o => o.id === id);
  if (index !== -1) {
    window.CUSTOMER_ORDERS[index].status = newStatus;
    saveCustomerOrders();
    toast("Durum Güncellendi", "Sipariş durumu başarıyla kaydedildi.");
  }
}
window.updateOrderStatus = updateOrderStatus;

function deleteCustomerFolder(id) {
  if(!confirm("Bu müşteri klasörünü ve tüm görsellerini silmek istediğinize emin misiniz?")) return;
  window.CUSTOMER_ORDERS = window.CUSTOMER_ORDERS.filter(o => o.id !== id);
  if(window.firebaseDb) window.dbRemove(window.dbRef(window.firebaseDb, `mami_customer_orders/${id}`));
  renderCustomerFolders();
  toast("Klasör Silindi", "Müşteri kaydı kaldırıldı.");
}
window.deleteCustomerFolder = deleteCustomerFolder;

function downloadAllPhotos(orderId) {
  const order = window.CUSTOMER_ORDERS.find(o => o.id === orderId);
  if(!order || !order.photos || order.photos.length === 0) {
    toast("Fotoğraf Yok", "İndirilecek fotoğraf bulunamadı.");
    return;
  }

  order.photos.forEach((b64, idx) => {
    const a = document.createElement("a");
    a.href = b64;
    a.download = `${order.custName.replace(/\s+/g, '_')}_Foto_${idx+1}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  toast("İndiriliyor", "Fotoğraflar indirilmeye başlandı.");
}
window.downloadAllPhotos = downloadAllPhotos;

const fileInput = $("custVehiclePhotos");
const dropZone = $("dropZone");

if(dropZone && fileInput) {
  ['dragenter', 'dragover'].forEach(name => {
    dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
  });
  ['dragleave', 'drop'].forEach(name => {
    dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
  });

  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    handleFiles(dt.files);
  });

  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
}

async function handleFiles(files) {
  const fileList = Array.from(files);
  for (const file of fileList) {
    const compressedB64 = await compressImage(file, 800, 0.65);
    uploadedBase64Files.push(compressedB64);
  }
  updatePreviewGrid();
}

function updatePreviewGrid() {
  const previewGrid = $("previewGrid");
  if (!previewGrid) return;
  previewGrid.innerHTML = "";

  uploadedBase64Files.forEach((b64, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "preview-wrapper";
    wrapper.innerHTML = `
      <img src="${b64}" class="upload-preview-item">
      <button class="remove-img-btn" onclick="removeSelectedImg(${index})">✕</button>
    `;
    previewGrid.appendChild(wrapper);
  });

  const badge = $("photoCountBadge");
  if(badge) {
    badge.style.display = "inline-block";
    badge.innerHTML = `Yüklenen: ${uploadedBase64Files.length} / 4 Fotoğraf ${uploadedBase64Files.length >= 4 ? '✓' : '(En az 4 adet gereklidir)'}`;
    badge.style.color = uploadedBase64Files.length >= 4 ? "var(--gold)" : "var(--danger)";
  }
}

function removeSelectedImg(index) {
  uploadedBase64Files.splice(index, 1);
  updatePreviewGrid();
}
window.removeSelectedImg = removeSelectedImg;

const orderBtn = $("orderBtn");
if(orderBtn) {
  orderBtn.onclick = () => {
    if (!selectedProduct) { toast("Tasarım Seçilmedi", "Lütfen önce kataloğdan bir tasarım seçin."); return; }
    const name = $("custName").value.trim();
    const phone = $("custPhone").value.trim();
    const notes = $("custNotes").value.trim();

    if (!name || !phone) { toast("Eksik Bilgi", "Lütfen Ad Soyad ve Telefon alanlarını doldurun."); return; }

    if (uploadedBase64Files.length < 4) {
      toast("Eksik Fotoğraf!", "Araç detaylarının net anlaşılması için en az 4 fotoğraf yüklemelisiniz.");
      return;
    }

    const orderData = {
      id: "ord_" + Date.now(),
      custName: name,
      custPhone: phone,
      productTitle: selectedProduct.title,
      productPrice: selectedProduct.price,
      notes: notes,
      photos: uploadedBase64Files,
      status: "pending",
      date: new Date().toLocaleString("tr-TR")
    };

    window.CUSTOMER_ORDERS.unshift(orderData);
    saveCustomerOrders();

    pendingOrderMessage = [
      "🔥 *MAMI WORKS — YENİ SİPARİŞ TALEBİ*",
      "----------------------------------",
      `🎨 *Tasarım:* ${selectedProduct.title}`,
      `💰 *Tutar:* ${Number(selectedProduct.price).toLocaleString("tr-TR")} TL`,
      "----------------------------------",
      "👤 *MÜŞTERİ BİLGİLERİ*",
      `• *Ad Soyad:* ${name}`,
      `• *Telefon:* ${phone}`,
      "----------------------------------",
      `📷 *Araç Fotoğrafları:* ${uploadedBase64Files.length} adet fotoğraf sisteme yüklendi.`,
      notes ? `• *Özel Not:* ${notes}` : "",
      "----------------------------------",
      "📄 *Ödeme Dekontunu Aşağıda Paylaşıyorum:* "
    ].filter(Boolean).join("\n");

    $("paymentModal").classList.add("active");
  };
}

const copyIbanBtn = $("copyIbanBtn");
if(copyIbanBtn) {
  copyIbanBtn.onclick = () => {
    const iban = $("ibanText").innerText;
    navigator.clipboard.writeText(iban).then(() => {
      toast("Kopyalandı!", "IBAN adresi panoya kopyalandı.");
    });
  };
}

const confirmOrderBtn = $("confirmOrderAndRedirectBtn");
if(confirmOrderBtn) {
  confirmOrderBtn.onclick = () => {
    $("paymentModal").classList.remove("active");
    window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_PHONE}&text=${encodeURIComponent(pendingOrderMessage)}`, "_blank");
  };
}

const adminLogoBtn = $("adminLogoBtn");
if(adminLogoBtn) adminLogoBtn.onclick = () => $("adminModal").classList.add("active");

const closeModalBtn = $("closeModalBtn");
if(closeModalBtn) closeModalBtn.onclick = () => $("adminModal").classList.remove("active");

const adminLoginBtn = $("adminLoginBtn");
if(adminLoginBtn) {
  adminLoginBtn.onclick = () => {
    const enteredPass = $("adminPassInput").value.trim();
    if (enteredPass === ADMIN_PASSWORD) {
      $("adminLoginBox").style.display = "none";
      $("adminControlsBox").style.display = "block";
      document.body.classList.add("admin-mode");
      renderProducts(); 
      renderCustomerFolders();
      toast("Giriş Başarılı", "Admin yönetim paneline bağlandınız.");
    } else {
      toast("Hata", "Girdiğiniz şifre geçersiz.");
    }
  };
}

const tabCustomerFoldersBtn = $("tabCustomerFoldersBtn");
if(tabCustomerFoldersBtn) {
  tabCustomerFoldersBtn.onclick = () => {
    $("tabCustomerFoldersBtn").classList.add("active"); $("tabAddProductBtn").classList.remove("active");
    $("tabCustomerFoldersContent").style.display = "block"; $("tabAddProductContent").style.display = "none";
    $("searchBoxContainer").style.display = "block";
    renderCustomerFolders();
  };
}

const tabAddProductBtn = $("tabAddProductBtn");
if(tabAddProductBtn) {
  tabAddProductBtn.onclick = () => {
    $("tabAddProductBtn").classList.add("active"); $("tabCustomerFoldersBtn").classList.remove("active");
    $("tabAddProductContent").style.display = "block"; $("tabCustomerFoldersContent").style.display = "none";
    $("searchBoxContainer").style.display = "none";
  };
}

const adminSearchInput = $("adminSearchInput");
if(adminSearchInput) adminSearchInput.oninput = () => renderCustomerFolders();

const saveProductBtn = $("saveProductBtn");
if(saveProductBtn) {
  saveProductBtn.onclick = async () => {
    const title = $("newTitle").value.trim();
    const price = Number($("newPrice").value);
    const file = $("newImgFile").files[0];

    if (!title || !price || !file) { toast("Eksik Alan", "Lütfen başlık, fiyat ve görsel alanlarını doldurun."); return; }

    const compressedImg = await compressImage(file, 800, 0.75);
    window.PRODUCTS.push({ id: "p_" + Date.now(), title, price, img: compressedImg });
    saveProducts(); renderProducts();
    $("newTitle").value = ""; $("newPrice").value = ""; $("newImgFile").value = "";
    toast("Eklendi", "Yeni tasarım kataloğa eklendi.");
  };
}

const adminLogoutBtn = $("adminLogoutBtn");
if(adminLogoutBtn) {
  adminLogoutBtn.onclick = () => {
    $("adminLoginBox").style.display = "block"; $("adminControlsBox").style.display = "none";
    document.body.classList.remove("admin-mode"); renderProducts();
    $("adminModal").classList.remove("active");
  };
}

function openLightbox(src) {
  currentZoom = 1; currentRotation = 0;
  const img = $("lightboxImg");
  img.src = src;
  img.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
  $("lightboxModal").classList.add("active");
}
window.openLightbox = openLightbox;

const zoomInBtn = $("zoomInBtn");
if(zoomInBtn) zoomInBtn.onclick = () => { currentZoom += 0.2; updateLightboxTransform(); };

const zoomOutBtn = $("zoomOutBtn");
if(zoomOutBtn) zoomOutBtn.onclick = () => { if(currentZoom > 0.4) currentZoom -= 0.2; updateLightboxTransform(); };

const rotateBtn = $("rotateBtn");
if(rotateBtn) rotateBtn.onclick = () => { currentRotation += 90; updateLightboxTransform(); };

const closeLightboxBtn = $("closeLightboxBtn");
if(closeLightboxBtn) closeLightboxBtn.onclick = () => $("lightboxModal").classList.remove("active");

function updateLightboxTransform() {
  $("lightboxImg").style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
}

const canvas = $("particleCanvas"); 
if(canvas) {
  const ctx = canvas.getContext("2d"); 
  let particles = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5; this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3; this.opacity = Math.random() * 0.4 + 0.1;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(215, 180, 106, ${this.opacity})`; ctx.fill();
    }
  }
  for (let i = 0; i < 40; i++) particles.push(new Particle());
  (function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); })();
}

const themeBtn = $("themeBtn");
if(themeBtn) {
  themeBtn.onclick = () => {
    document.body.classList.toggle("light-mode");
    themeBtn.innerHTML = document.body.classList.contains("light-mode") ? "☀️ Açık Mod" : "🌙 Koyu Mod";
  };
}
</script>
